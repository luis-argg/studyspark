<header class="header">
  <button
    type="button"
    class="menu-toggle"
    (click)="menuToggle.emit()"
    aria-controls="sidebar"
    aria-label="Abrir menú de navegación"
  >
    <span aria-hidden="true">☰</span>
  </button>

  <a routerLink="/tareas" class="brand">
    <span class="brand-mark" aria-hidden="true">✦</span>
    <span class="brand-name">StudySpark</span>
  </a>

  <p class="header-date">{{ todayLabel() }}</p>

  <div class="header-actions">
    <a
      routerLink="/notificaciones"
      class="icon-button"
      [attr.aria-label]="
        unreadCount() > 0 ? 'Notificaciones, ' + unreadCount() + ' sin leer' : 'Notificaciones'
      "
    >
      <span aria-hidden="true">◔</span>
      @if (unreadCount() > 0) {
        <span class="icon-badge">{{ unreadCount() }}</span>
      }
    </a>

    <button
      type="button"
      class="icon-button"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <span aria-hidden="true">{{ isDark() ? '☀' : '☾' }}</span>
    </button>

    <span class="avatar" aria-hidden="true">ES</span>
  </div>
</header>
